services:
  postgres:
    image: postgres:latest
    container_name: ai2-postgres
    environment:
      POSTGRES_USER: roadbuilders
      POSTGRES_PASSWORD: roadbuilders
      POSTGRES_DB: roadbuilders
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql
  neo4j:
    image: neo4j:latest
    container_name: ai2-neo4j
    environment:
      NEO4J_AUTH: neo4j/hallo_ai2
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - ./data/neo4j:/data
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: ai2-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - 'ES_JAVA_OPTS=-Xms2g -Xmx2g'
    ports:
      - '9200:9200'
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fs http://localhost:9200/_cluster/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio
    container_name: ai2-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: roadbuilders
      MINIO_ROOT_PASSWORD: roadbuilders
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./data/minio:/data
