services:
  postgres:
    image: postgres:latest
    container_name: ai2-postgres
    environment:
      POSTGRES_USER: roadbuilders
      POSTGRES_PASSWORD: roadbuilders
      POSTGRES_DB: roadbuilders
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql
  neo4j:
    image: neo4j:latest
    container_name: ai2-neo4j
    environment:
      NEO4J_AUTH: neo4j/hallo_ai2
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - ./data/neo4j:/data
  minio:
    image: minio/minio
    container_name: ai2-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: roadbuilders
      MINIO_ROOT_PASSWORD: roadbuilders
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./data/minio:/data
