# Leistungs-Registry: Dünne Asphaltdeckschicht in Kaltbauweise herstellen (DSK)
# Rule: `prior:` refs are only valid WITHIN an operation.
# Anything shared across operations is a derived_driver, computed once before fan-out.
# The mix is sold/applied by mass (Trockenmasse kg/m2): area x the mix's catalog kg/m2
# gives the order tonnage (coverage_tonnage), then the standard material_cost recipe.
work_type: dsk_herstellen
version: "2026-06-16"
triggers:
  keywords: [Dünne Asphaltdeckschicht, Kaltbauweise, DSK, Slurry, Dünnschichtbelag kalt,
             DSK 5, DSK 8, Asphaltmischgut DSK]

drivers:
  - id: material_spec
    source: judgment
    options: [DSK 5, DSK 8, DSK 11]
    description: >-
      Catalog key of the DSK mix. Match the Langtext's mix designation (DSK 5 / DSK 8 /
      DSK 11, i.e. the grobe Gesteinskörnung's max grain) to exactly ONE catalog entry;
      cite the decisive Langtext wording in source_quote.
  - {id: flaeche_m2,      source: plan,         einheit: m2,
     hint: "Einbauflaeche DSK Flaeche Verkehrsflaeche"}
  - {id: einbaubreite_m,  source: lv_text,      einheit: m}
  - {id: haul_distance_km, source: project,     einheit: km,
     hint: "Entfernung Mischwerk Lieferwerk Transportweg DSK-Mischgut"}
  - {id: access_class,    source: judgment,     options: [open, confined]}

derived_drivers:
  - id: dsk_tonnage_t
    einheit: t
    formula: coverage_tonnage
    params:
      area_m2:  {from: drivers, field: flaeche_m2}
      material: {from: store, call: material_property, args: [material_spec]}

operations:

  - id: supply_dsk
    label: "DSK-Mischgut liefern"
    requirements:
      - goal: "Cost the {material_spec} mix tonnage ab Werk"
        formula: material_cost
        params:
          tonnage_t:  {from: drivers, field: dsk_tonnage_t}
          price_eur_t: {from: store, call: material_price, args: [material_spec]}
      - goal: "Cost the delivery to site"
        formula: delivery_cost
        params:
          tonnage_t:   {from: drivers, field: dsk_tonnage_t}
          truck:       {from: store, call: truck_for_access, args: [access_class]}
          distance_km: {from: drivers, field: haul_distance_km}

  - id: dsk_einbau
    label: "DSK in Kaltbauweise einbauen"
    methods:
      - {id: dsk_fertiger,    machine_class: dsk_fertiger,
         criteria: "continuous runs, Einbaubreite >= ~1.0 m, zusammenhängende Flächen, machine-laid slurry"}
      - {id: dsk_kleingeraet, machine_class: kleingeraet,
         criteria: "nicht zusammenhängende Flächen, narrow/irregular patches, around fixtures, hand-applied"}
    selection:
      on: [flaeche_m2, einbaubreite_m, access_class]
      consult: [fleet_availability, reasoning_notes]
    requirements:
      - goal: "Calculate DSK laying duration"
        formula: duration_by_area_performance
        out: {id: dsk_hours, einheit: h}
        params:
          quantity_m2: {from: drivers, field: flaeche_m2}
          perf_m2_h:   {from: store, call: performance_rate, args: [operation_id, method_id, access_class]}
      - goal: "Cost the machine hours"
        formula: equipment_cost
        params:
          hours:      {from: prior, ref: dsk_hours}
          rate_eur_h: {from: store, call: bgl_rate, args: [machine_class]}
      - goal: "Cost the laying crew bound to the machine"
        formula: crew_cost
        params:
          hours: {from: prior, ref: dsk_hours}
          crew:  {from: store, call: crew_norm, args: [method_id]}
      - goal: "Cost machine mobilization to site"
        formula: machine_mobilization
        params:
          distance_km: {from: drivers, field: haul_distance_km}
          machine:     {from: store, call: mobilization_rate, args: [machine_class]}
