# Leistungs-Registry: Bankettbefestigung herstellen
# Rule: `prior:` refs are only valid WITHIN an operation.
# Anything shared across operations is a derived_driver, computed once before fan-out.
# Structurally the FSS recipe (supply -> distribute -> compact -> proof) applied to the
# Bankett: a narrow, profile-bound mineral-mix strip along the Fahrbahnkante. Reuses the
# distribute/compact operations and their methods verbatim, only the material catalog differs.
work_type: bankett_befestigen
version: "2026-06-16"
triggers:
  keywords: [Bankett, Bankettbefestigung, Banketterneuerung, Bankettmaterial,
             Mineralgemisch Bankett, standfestes Bankett]

drivers:
  - id: material_spec
    source: judgment
    options: [Mineralgemisch 0/32 B2, Mineralgemisch 0/45 B2,
              Schotter 0/32 gebr. Naturgestein]
    description: >-
      Catalog key of the Bankettmaterial. Match the Langtext's grading (0/32, 0/45)
      and material wording (Mineralgemisch B2 nach ZTV-StB LSBB, gebrochenes
      Naturgestein/Schotter) to exactly ONE catalog entry; cite the decisive Langtext
      wording in source_quote.
  - {id: einbaudicke_cm,  source: lv_text,      einheit: cm}
  - {id: ev2_target_mpa,  source: lv_text,      einheit: MPa}
  - id: strip_length_m
    source: plan
    einheit: m
    confirm: true
    hint: "Bankettlaenge Laenge Bankett abgerechnete Laenge Strecke"
    description: >-
      Installed length of the Bankett strip. The Baubeschreibung's Strecken-/Ausbaulaenge
      is the full length ONLY when the works run as a single Bauphase; with multiple
      Bauabschnitten only the phase length applies - if that is not stated, leave null.
  - {id: strip_width_m,   source: plan,         einheit: m,
     hint: "mittlere Breite Bankett Bankettbreite Streifenbreite"}
  - {id: haul_distance_km, source: project,     einheit: km,
     hint: "Entfernung Lieferwerk Transportweg Baustoffe Mineralgemisch"}
  - {id: ambient_temp_c,  source: "tool:climate", einheit: degC}
  - {id: access_class,    source: judgment,     options: [open, confined]}
  - {id: loss_profile,    source: judgment,     options: [standard, elevated]}

derived_drivers:
  - id: layer_volume_m3
    einheit: m3
    formula: layer_volume
    params:
      length_m:     {from: drivers, field: strip_length_m}
      width_m:      {from: drivers, field: strip_width_m}
      thickness_cm: {from: drivers, field: einbaudicke_cm}
  - id: order_tonnage_t
    einheit: t
    formula: order_tonnage
    params:
      volume_m3:    {from: drivers, field: layer_volume_m3}
      material:     {from: store, call: material_property, args: [material_spec]}
      loss_profile: {from: drivers, field: loss_profile}

operations:

  - id: supply_material
    label: "Bankettmaterial liefern"
    requirements:
      - goal: "Cost the {material_spec} delivery tonnage"
        formula: material_cost
        params:
          tonnage_t:  {from: drivers, field: order_tonnage_t}
          price_eur_t: {from: store, call: material_price, args: [material_spec]}
      - goal: "Cost the truck delivery to site"
        formula: delivery_cost
        params:
          tonnage_t:   {from: drivers, field: order_tonnage_t}
          truck:       {from: store, call: truck_for_access, args: [access_class]}
          distance_km: {from: drivers, field: haul_distance_km}

  - id: distribute
    label: "Bankettmaterial einbauen / profilgerecht verteilen"
    methods:
      - {id: motor_grader_3dgnss,  machine_class: grader_3d,
         criteria: "longer continuous Bankett runs, GNSS surface model available, gradient manageable"}
      - {id: dozer_loader_grader,  machine_class: loader_small,
         criteria: "narrow Bankett strips, profile by hand/small loader, confined edges, small volumes"}
    selection:
      on: [strip_length_m, strip_width_m, access_class]
      consult: [fleet_availability, reasoning_notes]
    requirements:
      - goal: "Calculate distribution duration"
        formula: duration_by_performance
        out: {id: dist_hours, einheit: h}
        params:
          quantity_m3: {from: drivers, field: layer_volume_m3}
          perf_m3_h:   {from: store, call: performance_rate, args: [operation_id, method_id, access_class]}
      - goal: "Cost the machine hours"
        formula: equipment_cost
        params:
          hours:      {from: prior, ref: dist_hours}
          rate_eur_h: {from: store, call: bgl_rate, args: [machine_class]}
      - goal: "Cost the crew bound to the machine"
        formula: crew_cost
        params:
          hours: {from: prior, ref: dist_hours}
          crew:  {from: store, call: crew_norm, args: [method_id]}
      - goal: "Cost machine mobilization to site"
        formula: machine_mobilization
        params:
          distance_km: {from: drivers, field: haul_distance_km}
          machine:     {from: store, call: mobilization_rate, args: [machine_class]}

  - id: compact
    label: "Verdichten auf Ev2-Ziel"
    methods:
      - {id: smooth_drum_roller, machine_class: roller_7t,
         criteria: "Bankett width >= drum width (~1.7 m), open runs, Ev2 proof on the mineral mix"}
      - {id: ruettelplatte,      machine_class: plate_500kg,
         criteria: "narrow Bankett strips, edges, around fixtures, Anpassung an die Fahrbahnkante"}
    selection:
      on: [strip_width_m, access_class, ev2_target_mpa]
      consult: [fleet_availability, reasoning_notes]
    requirements:
      - goal: "Estimate compaction duration to Ev2 {ev2_target_mpa} MPa"
        formula: duration_by_performance
        out: {id: comp_hours, einheit: h}
        params:
          quantity_m3: {from: drivers, field: layer_volume_m3}
          perf_m3_h:   {from: store, call: performance_rate, args: [operation_id, method_id, access_class]}
      - goal: "Cost the machine hours"
        formula: equipment_cost
        params:
          hours:      {from: prior, ref: comp_hours}
          rate_eur_h: {from: store, call: bgl_rate, args: [machine_class]}
      - goal: "Cost the crew bound to the machine"
        formula: crew_cost
        params:
          hours: {from: prior, ref: comp_hours}
          crew:  {from: store, call: crew_norm, args: [method_id]}
      - goal: "Cost compaction water (moisture conditioning)"
        formula: water_cost
        params:
          tonnage_t:    {from: drivers, field: order_tonnage_t}
          material:     {from: store, call: material_property, args: [material_spec]}
          ambient_temp_c: {from: drivers, field: ambient_temp_c}
          price_eur_m3: {from: store, call: material_price, args_const: [wasser]}
      - goal: "Cost machine mobilization to site"
        formula: machine_mobilization
        params:
          distance_km: {from: drivers, field: haul_distance_km}
          machine:     {from: store, call: mobilization_rate, args: [machine_class]}

  - id: proof_test
    label: "Verdichtungsnachweis (Plattendruckversuch)"
    requirements:
      - goal: "Cost the Ev2 proof tests over the Bankett area"
        formula: proof_test_cost
        params:
          length_m: {from: drivers, field: strip_length_m}
          width_m:  {from: drivers, field: strip_width_m}
          norm:     {from: store, call: test_norm, args_const: [plattendruck]}
