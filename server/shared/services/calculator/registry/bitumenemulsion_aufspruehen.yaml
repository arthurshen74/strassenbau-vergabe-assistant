# Leistungs-Registry: Bitumenemulsion aufsprühen (Schichtenverbund)
# Rule: `prior:` refs are only valid WITHIN an operation.
# Standalone Anspritzen for the Schichtenverbund - the same recipe as the asphalteinlage
# `vorspritzen` step: emulsion material (kg/m2 x area x price) plus the flat Spritzrampe rate.
# The Bindemittelmenge per grade is a catalog property; the LLM only selects the emulsion type.
work_type: bitumenemulsion_aufspruehen
version: "2026-06-16"
triggers:
  keywords: [Bitumenemulsion, Anspritzen, aufsprühen, Schichtenverbund, Haftbrücke,
             Bindemittel aufsprühen, Vorspritzen, Emulsion]

drivers:
  - id: emulsion_typ
    source: judgment
    options: [C 70 BP 4-OB, C 60 B 1-S, C 67 B 4]
    description: >-
      Catalog key of the Bitumenemulsion. Match the Langtext's binder designation
      (e.g. C 70 BP 4-OB gemäss TL BE-StB) to exactly ONE catalog entry; cite the
      decisive Langtext wording in source_quote.
  - {id: flaeche_m2,      source: plan,         einheit: m2,
     hint: "anzuspritzende Flaeche Verkehrsflaeche Flaeche Schichtenverbund"}

operations:

  - id: anspritzen
    label: "Bitumenemulsion aufsprühen"
    requirements:
      - goal: "Cost the {emulsion_typ} emulsion for the Schichtenverbund"
        formula: emulsion_cost
        params:
          area_m2:      {from: drivers, field: flaeche_m2}
          interlayer:   {from: store, call: material_property, args: [emulsion_typ]}
          price_eur_kg: {from: store, call: material_price, args: [emulsion_typ]}
      - goal: "Cost the emulsion application (Spritzrampe, flat rate)"
        formula: area_unit_cost
        params:
          area_m2:     {from: drivers, field: flaeche_m2}
          rate_eur_m2: {from: store, call: unit_rate, args_const: [anspritzen]}
