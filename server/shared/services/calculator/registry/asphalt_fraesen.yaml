# Leistungs-Registry: Asphalt fräsen
# Rule: `prior:` refs are only valid WITHIN an operation.
# Anything shared across operations is a derived_driver, computed once before fan-out.
# Two operations: the milling itself (method = Großfräse vs Kleinfräse, by Frästiefe/area),
# and hauling the Fräsgut off site. The haul tonnage reuses the volume->tonnage->delivery
# chain over a fixed Fräsasphalt density (loss 0, since this is removal not Mehrmenge).
work_type: asphalt_fraesen
version: "2026-06-16"
triggers:
  keywords: [Asphalt fräsen, Fräsen, Fräsgut, Frästiefe, Kaltfräsen, Abfräsen,
             Fräsasphalt, Anschlusskante]

drivers:
  - {id: frastiefe_cm,    source: lv_text,      einheit: cm}
  - {id: flaeche_m2,      source: plan,         einheit: m2,
     hint: "Fraesflaeche Asphaltflaeche Flaeche Fahrbahn"}
  - {id: haul_distance_km, source: project,     einheit: km,
     hint: "Entfernung Verwertung Recycler Bauhof Transportweg Fraesgut"}
  - {id: access_class,    source: judgment,     options: [open, confined]}

derived_drivers:
  - id: fraes_volume_m3
    einheit: m3
    formula: area_volume
    params:
      area_m2:      {from: drivers, field: flaeche_m2}
      thickness_cm: {from: drivers, field: frastiefe_cm}
  - id: fraes_tonnage_t
    einheit: t
    formula: order_tonnage
    params:
      volume_m3:    {from: drivers, field: fraes_volume_m3}
      material:     {from: store, call: material_property, args_const: [Fräsasphalt]}
      loss_profile: {from: const, value: standard}

operations:

  - id: fraesen
    label: "Asphalt fräsen"
    methods:
      - {id: kaltfraese_gross, machine_class: kaltfraese_gross,
         criteria: "large contiguous areas, full lane width, deeper Frästiefe, Fahrbahn"}
      - {id: kaltfraese_klein, machine_class: kaltfraese_klein,
         criteria: "confined Einzelflächen, narrow/shallow milling, edges, around fixtures"}
    selection:
      on: [flaeche_m2, frastiefe_cm, access_class]
      consult: [fleet_availability, reasoning_notes]
    requirements:
      - goal: "Calculate milling duration over the area"
        formula: duration_by_area_performance
        out: {id: fraes_hours, einheit: h}
        params:
          quantity_m2: {from: drivers, field: flaeche_m2}
          perf_m2_h:   {from: store, call: performance_rate, args: [operation_id, method_id, access_class]}
      - goal: "Cost the machine hours"
        formula: equipment_cost
        params:
          hours:      {from: prior, ref: fraes_hours}
          rate_eur_h: {from: store, call: bgl_rate, args: [machine_class]}
      - goal: "Cost the crew bound to the machine"
        formula: crew_cost
        params:
          hours: {from: prior, ref: fraes_hours}
          crew:  {from: store, call: crew_norm, args: [method_id]}
      - goal: "Cost machine mobilization to site"
        formula: machine_mobilization
        params:
          distance_km: {from: drivers, field: haul_distance_km}
          machine:     {from: store, call: mobilization_rate, args: [machine_class]}

  - id: abfahren
    label: "Fräsgut aufnehmen und abfahren"
    requirements:
      - goal: "Cost hauling the Fräsgut to the Verwertung"
        formula: delivery_cost
        params:
          tonnage_t:   {from: drivers, field: fraes_tonnage_t}
          truck:       {from: store, call: truck_for_access, args: [access_class]}
          distance_km: {from: drivers, field: haul_distance_km}
