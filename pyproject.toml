[project]
name = "strassenbau-vergabe-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pdf2image",
    "tqdm",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "fastapi",
    "python-multipart",
    "uvicorn[standard]",
    "httpx",
    "neo4j",
    "elasticsearch>=8.15,<9",
    "openai",
    "langchain-core",
    "langchain-text-splitters",
    "langchain==1.3.4",
    "langchain-community==0.4.2",
    "langchain-openai==1.2.2",
    "langchain-elasticsearch==1.0.0",
    "langgraph==1.2.4",
    "pypdf==6.12.2",
    "pdfplumber",
    "ragas",
    "boto3",
    "arize-phoenix-otel",
    "openinference-instrumentation-langchain",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary,pool]>=3.3.4",
    "spacy>=3.8.14",
    "docling>=2.113.0",
    "de-core-news-lg",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
# Deps-only project: server/, tests/ and eval/ share one environment.
# Nothing here is built or installed as a package.
package = false

[tool.uv.workspace]
members = [
    "nlp-playground/layout-spike",
    "nlp-textsummary",
]

[tool.uv.sources]
de-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["server"]
