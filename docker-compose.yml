services:
  postgres:
    image: postgres:latest
    container_name: ai2-postgres
    environment:
      POSTGRES_USER: ai2
      POSTGRES_PASSWORD: hallo_ai2
      POSTGRES_DB: ai2
    ports:
      - '5432:5432'
    volumes:
      - ./dbdata/postgres:/var/lib/postgresql/data
  neo4j:
    image: neo4j:latest
    container_name: ai2-neo4j
    environment:
      NEO4J_AUTH: neo4j/hallo_ai2
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - ./dbdata/neo4j:/data
