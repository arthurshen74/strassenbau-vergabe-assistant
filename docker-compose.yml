services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: strassenbau-vergabe-assistant-phoenix
    ports:
      - "6006:6006"   # web UI + HTTP OTLP collector (POST /v1/traces)
      - "4317:4317"   # gRPC OTLP collector
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - ./data/phoenix:/mnt/data
    restart: unless-stopped  
  postgres:
    image: postgres:latest
    container_name: strassenbau-vergabe-assistant-postgres
    env_file:
      - ./.env
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: strassenbau-vergabe-assistant-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - 'ES_JAVA_OPTS=-Xms2g -Xmx2g'
    ports:
      - '9200:9200'
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fs http://localhost:9200/_cluster/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio
    container_name: strassenbau-vergabe-assistant-minio
    command: server /data --console-address ":9001"
    env_file:
      - ./.env
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./data/minio:/data
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: strassenbau-vergabe-assistant-api
    command:
      - sh
      - -c
      - >
        python -m scripts.bootstrap_dbs &&
        python -m scripts.bootstrap_tables &&
        python -m scripts.bootstrap_storage &&
        uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: postgres
      ELASTICSEARCH_HOST: elasticsearch
      S3_HOST: minio
    ports:
      - '8000:8000'
    volumes:
      - ./server:/app/server
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health/db'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    # No container_name: it would block `docker compose up --scale worker=N`, the way ingestion
    # throughput is scaled (each replica competes for jobs via claim_next + SKIP LOCKED).
    command: ['python', '-m', 'worker.main']
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: postgres
      ELASTICSEARCH_HOST: elasticsearch
      S3_HOST: minio
    volumes:
      - ./server:/app/server
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_started
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: strassenbau-vergabe-assistant-ui
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - '5173:5173'
    volumes:
      - ./ui:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_started
